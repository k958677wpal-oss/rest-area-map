<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }

    .top-right-btns {
      position: absolute; top: 10px; right: 10px; z-index: 100;
      display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }
    .map-btn {
      padding: 8px 12px; font-size: 13px; border: none; border-radius: 6px;
      color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer;
      white-space: nowrap;
    }
    #resetBtn { background: #2E8B57; }
    #showAllRoutesBtn { background: #2F5597; }

    #leftPanels {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
      width: max-content;
      max-width: calc(100% - 20px);
    }

    #filterMasterBtn {
      padding: 8px 14px; font-size: 13px; font-weight: 700;
      border: none; border-radius: 8px;
      background: #2F5597; color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.25); cursor: pointer;
      white-space: nowrap; width: max-content;
    }
    #filterGroup { display: flex; flex-direction: column; gap: 8px; }
    #leftPanels.master-collapsed #filterGroup { display: none; }

    .panel-card {
      background: rgba(255,255,255,0.94);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      overflow: hidden;
      font-size: 12px;
    }
    .panel-head {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.04);
    }
    .panel-titlebox { display: flex; flex-direction: column; }
    .panel-title { font-weight: 700; color: #333; white-space: nowrap; }
    .panel-sub { font-size: 11px; color: #2F5597; font-weight: 600; white-space: nowrap; }
    .panel-toggle {
      margin-left: auto;
      border: none; background: transparent;
      font-size: 13px; color: #555; cursor: pointer; padding: 2px 6px; line-height: 1;
    }
    .panel-card.is-collapsed .panel-body { display: none; }

    #brandStats .bs-body { display: flex; align-items: stretch; }
    #brandStats.is-collapsed .bs-body { display: none; }

    #brandStats .bs-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 6px 10px;
      border-left: 1px solid rgba(0,0,0,0.08);
      min-width: 54px;
      cursor: pointer;
      transition: background .15s ease;
    }
    #brandStats .bs-cell:first-child { border-left: none; }
    #brandStats .bs-cell:hover { background: rgba(47,85,151,0.08); }
    #brandStats .bs-cell.is-active { background: rgba(47,85,151,0.16); }
    #brandStats .bs-name { font-weight: 700; margin-bottom: 2px; white-space: nowrap; }
    #brandStats .bs-value { color: #333; white-space: nowrap; }
    #brandStats .bs-GS25 .bs-name { color: #2770BF; }
    #brandStats .bs-CU .bs-name { color: #710E82; }
    #brandStats .bs-emart .bs-name { color: #C99700; }
    #brandStats .bs-seven .bs-name { color: #FF6C00; }
    #brandStats .bs-etc .bs-name { color: #888; }

    .chip-body { padding: 8px 10px; }
    .chip-row {
      display: flex; gap: 6px; flex-wrap: wrap;
      max-width: 300px;
    }
    .chip-row + .chip-row { margin-top: 6px; }
    .flt-chip {
      padding: 5px 10px; border-radius: 14px; font-size: 12px; font-weight: 600;
      background: #eee; color: #333; cursor: pointer; white-space: nowrap;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .flt-chip:hover { background: #e0e6f0; }
    .flt-chip.is-active { background: #2F5597; color: #fff; border-color: #2F5597; }
    .flt-empty-note { font-size: 11px; color: #999; padding: 2px 2px; }
    .etc-scroll {
      margin-top: 6px;
      max-height: 150px;
      overflow-y: auto;
      display: flex; flex-wrap: wrap; gap: 6px;
      max-width: 300px;
      padding-top: 6px;
      border-top: 1px dashed rgba(0,0,0,0.12);
    }

    @media (max-width: 768px) {
      #brandStats .bs-body {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
      }
      #brandStats.is-collapsed .bs-body { display: none; }
      #brandStats .bs-cell {
        border-left: none;
        border-top: 1px solid rgba(0,0,0,0.08);
        min-width: 0;
        padding: 6px 4px;
      }
      .chip-row, .etc-scroll { max-width: 240px; }
    }

    #debugPanel {
      position: absolute; left: 0; bottom: 0; z-index: 100;
      max-height: 35%; width: 100%; overflow-y: auto;
      background: rgba(0,0,0,.8); color: #0f0; font: 12px monospace;
      padding: 6px; display: none; white-space: pre-wrap;
    }
    .highway-label {
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      white-space: nowrap;
      transform: translate(-50%, -130%);
      text-align: center;
    }
    .highway-label .hl-name { line-height: 1.3; }
    .highway-label .hl-length {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.92;
      margin-top: 1px;
      line-height: 1.3;
    }

    .neighbor-info {
      position: relative;
      background: rgba(255,255,255,0.97);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      padding: 6px 9px;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
      transform: translateY(-56px);
      border-left: 4px solid #E67E22;
    }
    body.markers-small .neighbor-info { transform: translateY(-30px); }

    .neighbor-info .ni-title {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 2px;
      color: #333;
      padding-right: 16px;
    }
    .neighbor-info .ni-role {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #E67E22;
      border-radius: 6px;
      padding: 1px 5px;
      margin-left: 4px;
    }
    .neighbor-info.is-current { border-left-color: #2F5597; }
    .neighbor-info.is-current .ni-role { background: #2F5597; }

    .ni-close {
      position: absolute;
      top: 3px;
      right: 5px;
      width: 16px;
      height: 16px;
      line-height: 15px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      border-radius: 50%;
    }
    .ni-close:hover { background: #eee; color: #333; }

    .name-label {
      transform: translateY(-56px);
      background: rgba(33,33,33,0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    body.markers-small .name-label { transform: translateY(-30px); }

    .marker-pin {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      opacity: 1;
      transition: opacity .2s ease;
    }
    .pin-graphics {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: 50% 100%;
      transition: transform .2s ease;
    }
    .marker-pin .pin-circle {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,.35);
      box-sizing: border-box;
    }
    .marker-pin .pin-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .marker-pin .pin-tail {
      width: 0;
      height: 0;
      margin-top: -3px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid #ffffff;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
      pointer-events: none;
    }
    .marker-pin.is-dim { opacity: 0.3; }
    .marker-pin.is-small .pin-graphics { transform: scale(0.55); }

    .pin-badge {
      position: absolute;
      top: -6px; right: -6px;
      width: 18px; height: 18px;
      background: #E6194B; color: #fff;
      border: 2px solid #fff; border-radius: 50%;
      font-size: 11px; font-weight: 700;
      line-height: 15px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
      z-index: 5;
      overflow: visible;
    }

    .pin-history-badge {
      position: absolute;
      top: -6px; left: -6px;
      width: 18px; height: 18px;
      background: #2F5597; color: #fff;
      border: 2px solid #fff; border-radius: 50%;
      font-size: 10px; font-weight: 700;
      line-height: 15px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
      z-index: 5;
      overflow: visible;
    }

    .pin-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 8px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.5;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease;
      z-index: 30;
    }
    .pin-tooltip b { font-size: 13px; }
    .marker-pin:hover .pin-tooltip {
      opacity: 1;
      visibility: visible;
    }

    .iw-wrap {
      pointer-events: none;
      position: relative;
      margin-bottom: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
      min-width: 190px;
      max-width: 260px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    .iw-close {
      pointer-events: auto;
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      border-radius: 50%;
    }
    .iw-close:hover { background: #eee; color: #333; }
    .iw-title { font-size: 14px; font-weight: 700; padding-right: 18px; }

    .iw-history-btn {
      pointer-events: auto;
      margin-top: 8px;
      margin-right: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #2F5597;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .iw-history-btn:hover { background: #24407a; }

    .iw-distance-btn {
      pointer-events: auto;
      margin-top: 8px;
      margin-right: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #E67E22;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .iw-distance-btn:hover { background: #c0691b; }

    /* [신규] 사진 보기 버튼 */
    .iw-material-btn {
      pointer-events: auto;
      margin-top: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #2E8B57;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .iw-material-btn:hover { background: #226c43; }

    .iw-history-box {
      pointer-events: auto;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      max-height: 180px;
      overflow-y: auto;
    }
    .history-item {
      background: #f7f8fa;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 12px;
      line-height: 1.5;
    }
    .history-item .h-meta {
      color: #2F5597;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .history-empty {
      font-size: 12px;
      color: #999;
    }

    /* [신규] 팝업 안 자료 영역 */
    .iw-material-box {
      pointer-events: auto;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      font-size: 12px;
      line-height: 1.5;
    }
    .mat-contact { margin-bottom: 6px; }
    .mat-contact a { color: #1a5fb4; font-weight: 700; text-decoration: underline; }
    .mat-photos { display: flex; gap: 6px; }
    .mat-thumb {
      flex: 1 1 0;
      min-width: 0;
      height: 90px;
      border-radius: 6px;
      background: #e9ecef center / cover no-repeat;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .mat-thumb.is-loading {
      cursor: default;
      background: linear-gradient(90deg, #e9ecef 25%, #f6f7f8 37%, #e9ecef 63%);
      background-size: 400% 100%;
      animation: matShimmer 1.2s ease infinite;
    }
    .mat-thumb.is-failed { cursor: default; display: flex; align-items: center; justify-content: center; color: #999; font-size: 11px; }
    @keyframes matShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .mat-meta { margin-top: 6px; font-size: 11px; color: #888; }
    .mat-error { color: #E6194B; font-size: 11px; margin-top: 4px; }

    /* [신규] 사진 크게 보기 */
    #lightbox {
      display: none;
      position: fixed; left: 0; top: 0; width: 100%; height: 100%;
      z-index: 100000;
      background: rgba(0,0,0,0.92);
      color: #fff;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }
    #lightbox.is-open { display: flex; }
    .lb-top {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 13px; flex: 0 0 auto;
    }
    .lb-title { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-counter { font-size: 12px; opacity: .8; }
    .lb-btn {
      border: none; background: rgba(255,255,255,0.16); color: #fff;
      border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer;
      line-height: 34px; padding: 0;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.3); }
    .lb-stage {
      position: relative; flex: 1 1 auto; min-height: 0;
      overflow: auto; display: flex; align-items: center; justify-content: center;
    }
    .lb-stage img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      cursor: zoom-in; display: block;
    }
    .lb-stage.is-zoomed { align-items: flex-start; justify-content: flex-start; }
    .lb-stage.is-zoomed img {
      max-width: none; max-height: none; width: 220%; height: auto; cursor: zoom-out;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 2;
    }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
    .lb-thumbs {
      display: flex; gap: 6px; justify-content: center;
      padding: 8px; flex: 0 0 auto;
    }
    .lb-thumbs img {
      width: 52px; height: 52px; object-fit: cover; border-radius: 6px;
      opacity: .5; cursor: pointer; border: 2px solid transparent;
    }
    .lb-thumbs img.is-active { opacity: 1; border-color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="leftPanels" class="master-collapsed">
    <button id="filterMasterBtn">🔎 필터 열기</button>
    <div id="filterGroup">
      <div id="brandStats" class="panel-card is-collapsed"></div>
      <div id="contractFilterPanel" class="panel-card is-collapsed"></div>
      <div id="operatorFilterPanel" class="panel-card is-collapsed"></div>
    </div>
  </div>

  <div class="top-right-btns">
    <button id="resetBtn" class="map-btn">🏠 홈</button>
    <button id="showAllRoutesBtn" class="map-btn">전체 노선 보기</button>
  </div>

  <div id="lightbox">
    <div class="lb-top">
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-counter" id="lbCounter"></div>
      <button class="lb-btn" id="lbClose">×</button>
    </div>
    <div class="lb-stage" id="lbStage">
      <button class="lb-btn lb-nav lb-prev" id="lbPrev">‹</button>
      <img id="lbImg" alt="">
      <button class="lb-btn lb-nav lb-next" id="lbNext">›</button>
    </div>
    <div class="lb-thumbs" id="lbThumbs"></div>
  </div>

  <div id="debugPanel"></div>
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fbd1e96068b754f1939c7e11a2790ce1&autoload=false"></script>
  <script>
    var BRAND_IMAGES = {
      "GS25": "images/GS25.PNG",
      "CU": "images/CU.PNG",
      "7-11": "images/7-11.PNG",
      "이마트24": "images/emart24.PNG",
      "기타": "images/ect.PNG"
    };
    function resolveBrandImage(brand) {
      if (brand === "세븐일레븐") return BRAND_IMAGES["7-11"];
      if (BRAND_IMAGES[brand]) return BRAND_IMAGES[brand];
      return BRAND_IMAGES["기타"];
    }

    var BRAND_COLORS = {
      "GS25": "#2770BF",
      "CU": "#710E82",
      "세븐일레븐": "#FF6C00",
      "7-11": "#FF6C00",
      "이마트24": "#FFC000",
      "기타": "#BFBFBF"
    };
    function resolveBrandColor(brand) {
      if (BRAND_COLORS[brand]) return BRAND_COLORS[brand];
      return BRAND_COLORS["기타"];
    }

    var ROUTE_COLOR_PALETTE = [
      "#E6194B", "#3CB44B", "#4363D8", "#F58231", "#911EB4",
      "#008080", "#9A6324", "#800000", "#808000", "#000075",
      "#E6799A", "#46F0F0", "#F032E6", "#BCBD22", "#17BECF",
      "#D2691E", "#1F77B4", "#2CA02C", "#8C564B", "#E377C2"
    ];
    function getRouteColor(highway) {
      var s = String(highway || "");
      var hash = 0;
      for (var i = 0; i < s.length; i++) {
        hash = (hash * 31 + s.charCodeAt(i)) % 1000000007;
      }
      var idx = Math.abs(hash) % ROUTE_COLOR_PALETTE.length;
      return ROUTE_COLOR_PALETTE[idx];
    }

    var BRAND_STAT_ORDER = [
      { key: "GS25",   label: "GS25",   cls: "bs-GS25" },
      { key: "CU",     label: "CU",     cls: "bs-CU" },
      { key: "이마트24", label: "이마트24", cls: "bs-emart" },
      { key: "7-11",   label: "7-11",   cls: "bs-seven" },
      { key: "매점",    label: "매점",    cls: "bs-etc" }
    ];

    function classifyBrand(brand) {
      var b = (brand == null ? "" : String(brand)).trim();
      if (b === "GS25") return "GS25";
      if (b === "CU") return "CU";
      if (b === "이마트24") return "이마트24";
      if (b === "세븐일레븐" || b === "7-11") return "7-11";
      return "매점";
    }

    function brandLabelText(key) {
      for (var i = 0; i < BRAND_STAT_ORDER.length; i++) {
        if (BRAND_STAT_ORDER[i].key === key) return BRAND_STAT_ORDER[i].label;
      }
      return key;
    }

    var brandStatsCollapsed = true;

    function updateBrandStats(markers, routeLabel) {
      var counts = { "GS25": 0, "CU": 0, "이마트24": 0, "7-11": 0, "매점": 0 };
      var total = 0;
      (markers || []).forEach(function (item) {
        counts[classifyBrand(item.point.brand)] += 1;
        total += 1;
      });

      var cellsHtml = "";
      BRAND_STAT_ORDER.forEach(function (b) {
        var cnt = counts[b.key];
        var pct = (total > 0) ? Math.round((cnt / total) * 100) : 0;
        var activeCls = (filterMode === 'brand' && activeBrandKey === b.key) ? ' is-active' : '';
        cellsHtml += '<div class="bs-cell ' + b.cls + activeCls + '" data-brand="' + b.key + '">' +
                       '<span class="bs-name">' + b.label + '</span>' +
                       '<span class="bs-value">' + cnt + '(' + pct + '%)</span>' +
                     '</div>';
      });

      var arrow = brandStatsCollapsed ? '▼' : '▲';
      var html =
        '<div class="panel-head">' +
          '<div class="panel-titlebox">' +
            '<span class="panel-title">브랜드 점유율</span>' +
            '<span class="panel-sub">(' + (routeLabel || '전체노선') + ')</span>' +
          '</div>' +
          '<button class="panel-toggle" id="bsToggle">' + arrow + '</button>' +
        '</div>' +
        '<div class="panel-body bs-body">' + cellsHtml + '</div>';

      var container = document.getElementById('brandStats');
      container.innerHTML = html;
      container.classList.toggle('is-collapsed', brandStatsCollapsed);

      var toggleBtn = document.getElementById('bsToggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          brandStatsCollapsed = !brandStatsCollapsed;
          container.classList.toggle('is-collapsed', brandStatsCollapsed);
          toggleBtn.textContent = brandStatsCollapsed ? '▼' : '▲';
        });
      }

      var cells = container.querySelectorAll('.bs-cell');
      for (var c = 0; c < cells.length; c++) {
        cells[c].addEventListener('click', function () {
          filterByBrand(this.getAttribute('data-brand'));
        });
      }
    }

    function parseContractYear(contractStr) {
      var s = (contractStr == null ? "" : String(contractStr)).trim();
      if (!s) return null;
      var m4 = s.match(/(20\d{2})/);
      if (m4) return parseInt(m4[1], 10);
      var m2 = s.match(/^(\d{2})\./);

    function normalize(s) {
      return (s == null ? "" : String(s)).replace(/\s+/g, "").trim();
    }

    function formatRouteLength(highway) {
      var v = ROUTE_LENGTHS_LOOKUP[normalize(highway)];
      if (v == null || v === "") return "";
      var num = parseFloat(v);
      if (isNaN(num)) return String(v) + "km";
      return num + "km";
    }

    function loadPrecomputedRoutes() {
      fetch('routes.json')
        .then(function (res) {
          if (!res.ok) throw new Error('routes.json 로드 실패: ' + res.status);
          return res.json();
        })
        .then(function (data) {
          PRECOMPUTED_ROUTES = data || {};
          PRECOMPUTED_LOOKUP = {};
          for (var k in PRECOMPUTED_ROUTES) {
            if (PRECOMPUTED_ROUTES.hasOwnProperty(k)) {
              PRECOMPUTED_LOOKUP[normalize(k)] = PRECOMPUTED_ROUTES[k];
            }
          }
          precomputedRoutesLoaded = true;
          log('📁 routes.json 로드 완료 (' + Object.keys(PRECOMPUTED_ROUTES).length + '개 노선)');
          rerenderLastState();
        })
        .catch(function (err) {
          log('⚠ routes.json 로드 실패, 휴게소 연결 방식으로 대체: ' + err);
          precomputedRoutesLoaded = true;
        });
    }

    function loadDistancesData() {
      fetch('distances.json')
        .then(function (res) {
          if (!res.ok) throw new Error('distances.json 로드 실패: ' + res.status);
          return res.json();
        })
        .then(function (data) {
          DISTANCES_DATA = data || {};

          var routesObj, segmentsObj;
          if (DISTANCES_DATA.routes) {
            routesObj = DISTANCES_DATA.routes;
            segmentsObj = DISTANCES_DATA.segments || {};
          } else {
            routesObj = DISTANCES_DATA;
            segmentsObj = {};
          }

          DISTANCE_SEGMENTS = segmentsObj;
          DISTANCE_ENTRY_LOOKUP = {};

          for (var highway in routesObj) {
            if (!routesObj.hasOwnProperty(highway)) continue;
            if (highway === 'segments') continue;
            var directions = routesObj[highway];
            if (!directions || typeof directions !== 'object') continue;
            for (var direction in directions) {
              if (!directions.hasOwnProperty(direction)) continue;
              var list = directions[direction];
              if (!list || !list.length) continue;
              for (var i = 0; i < list.length; i++) {
                var e = list[i];
                if (e && e.name) {
                  DISTANCE_ENTRY_LOOKUP[e.name] = { highway: highway, direction: direction, entry: e };
                }
              }
            }
          }

          distancesLoaded = true;
          log('📁 distances.json 로드 완료 (거리정보 ' + Object.keys(DISTANCE_ENTRY_LOOKUP).length + '개 휴게소, 구간 ' + Object.keys(DISTANCE_SEGMENTS).length + '개)');
        })
        .catch(function (err) {
          log('⚠ distances.json 로드 실패, 거리 보기 비활성화: ' + err);
          distancesLoaded = true;
        });
    }

    function applyRouteLengths(routeLengths) {
      if (routeLengths == null) return;
      ROUTE_LENGTHS = routeLengths || {};
      ROUTE_LENGTHS_LOOKUP = {};
      for (var k in ROUTE_LENGTHS) {
        if (ROUTE_LENGTHS.hasOwnProperty(k)) {
          ROUTE_LENGTHS_LOOKUP[normalize(k)] = ROUTE_LENGTHS[k];
        }
      }
      log('📏 노선 길이 데이터 반영 (' + Object.keys(ROUTE_LENGTHS).length + '개 노선)');
    }

    function fetchPhotosFor(p) {
      var m = p.material;
      if (PHOTO_CACHE[p.name]) return Promise.resolve(PHOTO_CACHE[p.name]);
      if (PHOTO_PENDING[p.name]) return PHOTO_PENDING[p.name];
      if (!DRIVE_CFG || !DRIVE_CFG.url) return Promise.reject(new Error('no_config'));

      var pr = fetch(DRIVE_CFG.url, {
        method: 'POST',
        // text/plain 으로 보내야 브라우저의 사전 확인(preflight)이 생략되어 Apps Script에서 안정적으로 동작합니다.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key: DRIVE_CFG.key, action: 'get_many', ids: m.ids })
      })
        .then(function (res) { return res.json(); })
        .then(function (out) {
          if (!out || !out.ok) throw new Error((out && out.error) || 'fail');
          var byId = {};
          (out.items || []).forEach(function (it) { byId[it.id] = it; });
          var arr = m.ids.map(function (id) {
            var it = byId[id];
            return (it && it.ok) ? ('data:' + it.mime + ';base64,' + it.data) : null;
          });
          PHOTO_CACHE[p.name] = arr;
          delete PHOTO_PENDING[p.name];
          return arr;
        })
        .catch(function (err) {
          delete PHOTO_PENDING[p.name];
          throw err;
        });

      PHOTO_PENDING[p.name] = pr;
      return pr;
    }

    function renderMaterialBox(box, p) {
      var m = p.material;
      if (!m) {
        box.innerHTML = '<div class="history-empty">등록된 자료가 없습니다.</div>';
        return;
      }
      var ids = m.ids || [];
      var html = buildMaterialContactHtml(m);

      if (ids.length) {
        html += '<div class="mat-photos">';
        for (var i = 0; i < ids.length; i++) {
          html += '<div class="mat-thumb is-loading" data-idx="' + i + '"></div>';
        }
        html += '</div>';
      }
      var meta = [];
      if (m.uploader) meta.push(escapeHtml(m.uploader));
      if (m.uploaded_at) meta.push(escapeHtml(String(m.uploaded_at).substring(0, 10)));
      if (meta.length) html += '<div class="mat-meta">등록: ' + meta.join(' · ') + '</div>';
      html += '<div class="mat-error" style="display:none;"></div>';
      box.innerHTML = html;

      if (!ids.length) return;

      var errEl = box.querySelector('.mat-error');
      fetchPhotosFor(p).then(function (photos) {
        if (!box.isConnected) return;
        var thumbs = box.querySelectorAll('.mat-thumb');
        var valid = [];
        photos.forEach(function (u) { if (u) valid.push(u); });
        for (var i = 0; i < thumbs.length; i++) {
          var t = thumbs[i];
          t.classList.remove('is-loading');
          var url = photos[i];
          if (url) {
            t.style.backgroundImage = 'url("' + url + '")';
            (function (url) {
              t.addEventListener('click', function (e) {
                e.stopPropagation();
                openLightbox(valid, valid.indexOf(url), p.name);
              });
            })(url);
          } else {
            t.classList.add('is-failed');
            t.textContent = '불러오기 실패';
          }
        }
      }).catch(function (err) {
        if (!box.isConnected) return;
        var thumbs = box.querySelectorAll('.mat-thumb');
        for (var i = 0; i < thumbs.length; i++) {
          thumbs[i].classList.remove('is-loading');
          thumbs[i].classList.add('is-failed');
          thumbs[i].textContent = '불러오기 실패';
        }
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = (String(err && err.message) === 'no_config')
            ? '사진 서버 설정이 전달되지 않았습니다. 앱을 새로고침해 주세요.'
            : '사진을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요. (' + (err && err.message ? err.message : err) + ')';
        }
        log('⚠ 사진 로드 실패: ' + err);
      });
    }

    // ───────── [신규] 사진 크게 보기 ─────────
    var LB = { photos: [], idx: 0, title: '', zoomed: false };

    function lbEl(id) { return document.getElementById(id); }

    function lbRender() {
      var total = LB.photos.length;
      lbEl('lbImg').src = LB.photos[LB.idx];
      lbEl('lbTitle').textContent = LB.title;
      lbEl('lbCounter').textContent = total > 1 ? ((LB.idx + 1) + ' / ' + total) : '';
      lbEl('lbPrev').style.display = total > 1 ? 'block' : 'none';
      lbEl('lbNext').style.display = total > 1 ? 'block' : 'none';
      lbEl('lbStage').classList.toggle('is-zoomed', LB.zoomed);

      var th = lbEl('lbThumbs');
      th.innerHTML = '';
      if (total > 1) {
        LB.photos.forEach(function (u, i) {
          var im = document.createElement('img');
          im.src = u;
          if (i === LB.idx) im.className = 'is-active';
          im.addEventListener('click', function () { LB.idx = i; LB.zoomed = false; lbRender(); });
          th.appendChild(im);
        });
      }
    }

    function openLightbox(photos, idx, title) {
      if (!photos || !photos.length) return;
      LB.photos = photos;
      LB.idx = Math.max(0, idx || 0);
      LB.title = title || '';
      LB.zoomed = false;
      lbEl('lightbox').classList.add('is-open');
      lbRender();
    }

    function closeLightbox() {
      lbEl('lightbox').classList.remove('is-open');
      lbEl('lbImg').src = '';
    }

    function lbMove(delta) {
      var total = LB.photos.length;
      if (total < 2) return;
      LB.idx = (LB.idx + delta + total) % total;
      LB.zoomed = false;
      lbRender();
    }

    (function initLightbox() {
      lbEl('lbClose').addEventListener('click', closeLightbox);
      lbEl('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); lbMove(-1); });
      lbEl('lbNext').addEventListener('click', function (e) { e.stopPropagation(); lbMove(1); });

      // 사진을 누르면 확대/축소
      lbEl('lbImg').addEventListener('click', function (e) {
        e.stopPropagation();
        LB.zoomed = !LB.zoomed;
        lbEl('lbStage').classList.toggle('is-zoomed', LB.zoomed);
        lbEl('lbStage').scrollTop = 0;
        lbEl('lbStage').scrollLeft = 0;
      });
      // 사진 바깥(검은 배경)을 누르면 닫기
      lbEl('lbStage').addEventListener('click', function (e) {
        if (e.target === lbEl('lbStage')) closeLightbox();
      });

      // 좌우로 밀어서 넘기기 (확대 중에는 스크롤을 위해 비활성)
      var sx = null, sy = null;
      lbEl('lbStage').addEventListener('touchstart', function (e) {
        if (LB.zoomed || e.touches.length !== 1) { sx = null; return; }
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      }, { passive: true });
      lbEl('lbStage').addEventListener('touchend', function (e) {
        if (sx == null || LB.zoomed) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - sx, dy = t.clientY - sy;
        sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          lbMove(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      document.addEventListener('keydown', function (e) {
        if (!lbEl('lightbox').classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lbMove(-1);
        else if (e.key === 'ArrowRight') lbMove(1);
      });
    })();

    function clearRoute() {
      allPolylines.forEach(function (pl) { pl.setMap(null); });
      allLabels.forEach(function (lb) { lb.overlay.setMap(null); });
      allPolylines = [];
      allLabels = [];
    }

    function squaredDistance(a, b) {
      var dLat = a.lat - b.lat;
      var dLng = a.lng - b.lng;
      return dLat * dLat + dLng * dLng;
    }

    function computeSortedGroup(highway) {
      var target = normalize(highway);
      var group = allMarkers.filter(function (item) {
        return normalize(item.point.highway) === target;
      });
      if (group.length < 2) return group;

      var farA = 0, farB = 1, maxDist = -1;
      for (var i = 0; i < group.length; i++) {
        for (var k = i + 1; k < group.length; k++) {
          var d = squaredDistance(group[i].point, group[k].point);
          if (d > maxDist) { maxDist = d; farA = i; farB = k; }
        }
      }

      var remaining = group.slice();
      var sorted = [];
      var current = remaining.splice(farA, 1)[0];
      sorted.push(current);

      while (remaining.length > 0) {
        var nearestIdx = 0;
        var nearestDist = squaredDistance(current.point, remaining[0].point);
        for (var j = 1; j < remaining.length; j++) {
          var dd = squaredDistance(current.point, remaining[j].point);
          if (dd < nearestDist) { nearestDist = dd; nearestIdx = j; }
        }
        current = remaining.splice(nearestIdx, 1)[0];
        sorted.push(current);
      }
      return sorted;
    }

    function coordsToLatLngPath(coordArray) {
      return coordArray.map(function (c) {
        return new kakao.maps.LatLng(c[0], c[1]);
      });
    }

    function drawSingleRoute(highway) {
      var precomputed = PRECOMPUTED_LOOKUP[normalize(highway)];
      var path;
      var isPrecise = false;

      if (precomputed && precomputed.length >= 2) {
        path = coordsToLatLngPath(precomputed);
        isPrecise = true;
        log('✅ 정밀 노선 사용: "' + highway + '" (' + path.length + '개 좌표)');
      } else {
        log('⚠ 정밀 노선 없음, 휴게소 연결로 대체: "' + highway + '"');
        var group = computeSortedGroup(highway);
        if (group.length < 2) {
          return;
        }
        path = group.map(function (item) {
          return new kakao.maps.LatLng(item.point.lat, item.point.lng);
        });
      }

      var color = isPrecise ? '#1F4E9C' : getRouteColor(highway);
      var weight = isPrecise ? 6 : 4;
      var style = isPrecise ? 'solid' : 'shortdash';

      var polyline = new kakao.maps.Polyline({
        path: path, strokeWeight: weight, strokeColor: color,
        strokeOpacity: 0.9, strokeStyle: style
      });
      polyline.setMap(map);
      allPolylines.push(polyline);

      var lengthText = formatRouteLength(highway);
      var nameLine = highway + (isPrecise ? '' : ' (근사)');
      var labelHtml =
        '<div class="highway-label" style="background:' + color + ';">' +
          '<div class="hl-name">' + nameLine + '</div>' +
          (lengthText ? '<div class="hl-length">총 길이 ' + lengthText + '</div>' : '') +
        '</div>';

      var labelOverlay = new kakao.maps.CustomOverlay({
        position: path[Math.floor(path.length / 2)],
        content: labelHtml,
        yAnchor: 1, zIndex: 15
      });
      allLabels.push({ overlay: labelOverlay, path: path, color: color });
    }

    function drawRoute(highway) {
      clearRoute();
      if (!normalize(highway)) return;
      drawSingleRoute(highway);
      updateLabelPosition();
    }

    function showAllRoutes() {
      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = true;
      isShowingDistanceView = false;
      lastRenderState = { type: 'all' };
      clearMarkerFilter();

      allMarkers.forEach(function (item) {
        item.el.classList.remove('is-dim');
        setMarkerZ(item, Z_BASE, true);
      });

      var seen = {}, highways = [];
      allMarkers.forEach(function (item) {
        var hw = item.point.highway;
        var key = normalize(hw);
        if (key && !seen[key]) { seen[key] = true; highways.push(hw); }
      });

      highways.forEach(function (hw) { drawSingleRoute(hw); });
      updateLabelPosition();
      updateBrandStats(allMarkers, '전체노선');
    }

    function fitBoundsToNames(names) {
      if (!map) return;
      var bounds = new kakao.maps.LatLngBounds();
      var found = false;
      names.forEach(function (n) {
        if (!n) return;
        var item = findMarkerByName(n);
        if (item) {
          bounds.extend(item.overlay.getPosition());
          found = true;
        }
      });
      if (found) {
        map.setBounds(bounds, 90, 90, 90, 90);
      }
    }

    function showDistanceViewFor(p) {
      var found = findDistanceEntry(p.name);
      if (!found) {
        log('❌ "' + p.name + '"의 거리 정보를 찾을 수 없습니다.');
        return;
      }

      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = false;
      isShowingDistanceView = true;
      lastRenderState = { type: 'distance', name: p.name };
      clearMarkerFilter();

      var entry = found.entry;

      var showNames = {};
      showNames[entry.name] = true;
      if (entry.prev) showNames[entry.prev.name] = true;
      if (entry.next) showNames[entry.next.name] = true;

      allMarkers.forEach(function (item) {
        if (showNames[item.point.name]) {
          item.el.classList.remove('is-dim');
          setMarkerZ(item, Z_HIGHLIGHT, true);
        } else {
          item.el.classList.add('is-dim');
          setMarkerZ(item, Z_DIM, true);
        }
      });

      if (entry.prev) {
        drawNeighborSegment(entry.prev.name, entry.name, entry.prev, entry.prev.segment);
      }
      if (entry.next) {
        drawNeighborSegment(entry.name, entry.next.name, entry.next, entry.next.segment);
      }

      drawNeighborInfo(entry.name, '현재', true);
      if (entry.prev) drawNeighborInfo(entry.prev.name, '이전 · ' + entry.prev.km + 'km', false);
      if (entry.next) drawNeighborInfo(entry.next.name, '다음 · ' + entry.next.km + 'km', false);

      fitBoundsToNames([entry.name, entry.prev ? entry.prev.name : null, entry.next ? entry.next.name : null]);

      updateBrandStats(
        allMarkers.filter(function (item) { return showNames[item.point.name]; }),
        p.name + ' 전후 거리'
      );
    }

    function drawNeighborSegment(fromName, toName, info, segmentKey) {
      var path = null;

      if (segmentKey && DISTANCE_SEGMENTS[segmentKey] && DISTANCE_SEGMENTS[segmentKey].length >= 2) {
        path = coordsToLatLngPath(DISTANCE_SEGMENTS[segmentKey]);
      } else {
        var a = findMarkerByName(fromName);
        var b = findMarkerByName(toName);
        if (!a || !b) return;
        path = [a.overlay.getPosition(), b.overlay.getPosition()];
      }

      if (!path || path.length < 2) return;

      var isDetour = !!(info && info.detour);
      var color = isDetour ? '#E6194B' : '#1F4E9C';

      var polyline = new kakao.maps.Polyline({
        path: path, strokeWeight: 5, strokeColor: color,
        strokeOpacity: 0.95, strokeStyle: 'solid'
      });
      polyline.setMap(map);
      allPolylines.push(polyline);
    }

    function drawNeighborInfo(name, roleLabel, isCurrent) {
      var item = findMarkerByName(name);
      if (!item) return;

      var p = item.point;
      var closeBtn = isCurrent
        ? '<span class="ni-close" onclick="exitDistanceView()">×</span>'
        : '';

      var html =
        '<div class="neighbor-info' + (isCurrent ? ' is-current' : '') + '">' +
          closeBtn +
          '<div class="ni-title">' + escapeHtml(p.name) +
            '<span class="ni-role">' + escapeHtml(roleLabel) + '</span>' +
          '</div>' +
          '브랜드: ' + escapeHtml(p.brand) + '<br>' +
          '추정매출: ' + escapeHtml(formatEstimated(p.estimated_revenue)) +
        '</div>';

      var overlay = new kakao.maps.CustomOverlay({
        position: item.overlay.getPosition(),
        content: html,
        yAnchor: 1,
        zIndex: 30,
        clickable: true
      });
      overlay.setMap(map);
      allLabels.push({ overlay: overlay, path: [item.overlay.getPosition()], color: isCurrent ? '#2F5597' : '#E67E22' });
    }

    function updateLabelPosition() {
      if (!map || !allLabels.length) return;

      if (isShowingDistanceView) return;

      if (isShowingAllRoutes && map.getLevel() > LABEL_MAX_ZOOM_LEVEL) {
        allLabels.forEach(function (lb) { lb.overlay.setMap(null); });
        return;
      }

      var bounds = map.getBounds();
      var center = map.getCenter();
      var cLat = center.getLat(), cLng = center.getLng();

      var projection = null;
      try { projection = map.getProjection(); } catch (e) { projection = null; }
      var placedPoints = [];

      allLabels.forEach(function (lb) {
        var path = lb.path;
        var best = null, bestDist = Infinity;
        for (var i = 0; i < path.length; i++) {
          var pt = path[i];
          if (!bounds.contain(pt)) continue;
          var dLat = pt.getLat() - cLat;
          var dLng = pt.getLng() - cLng;
          var dist = dLat * dLat + dLng * dLng;
          if (dist < bestDist) { bestDist = dist; best = pt; }
        }
        if (!best) { lb.overlay.setMap(null); return; }

        var tooClose = false;
        if (projection) {
          try {
            var cp = projection.containerPointFromCoords(best);
            for (var j = 0; j < placedPoints.length; j++) {
              var dx = cp.x - placedPoints[j].x;
              var dy = cp.y - placedPoints[j].y;
              if (Math.sqrt(dx * dx + dy * dy) < LABEL_MIN_GAP_PX) { tooClose = true; break; }
            }
            if (!tooClose) placedPoints.push(cp);
          } catch (e) { tooClose = false; }
        }

        if (tooClose) { lb.overlay.setMap(null); }
        else { lb.overlay.setPosition(best); lb.overlay.setMap(map); }
      });
    }

    function updateFilteredNameLabels() {
      if (!map) return;

      if (!filterMode) {
        allMarkers.forEach(function (item) {
          if (item.nameLabel) item.nameLabel.setMap(null);
        });
        return;
      }

      var alwaysShow = filteredMarkerItems.length <= FILTER_LABEL_THRESHOLD;
      if (!alwaysShow && map.getLevel() > NAME_LABEL_MAX_ZOOM_LEVEL) {
        filteredMarkerItems.forEach(function (item) {
          if (item.nameLabel) item.nameLabel.setMap(null);
        });
        return;
      }

      var bounds = map.getBounds();
      var projection = null;
      try { projection = map.getProjection(); } catch (e) { projection = null; }
      var placedPoints = [];

      filteredMarkerItems.forEach(function (item) {
        var pos = item.overlay.getPosition();
        if (!bounds.contain(pos)) {
          if (item.nameLabel) item.nameLabel.setMap(null);
          return;
        }

        var tooClose = false;
        if (projection) {
          try {
            var cp = projection.containerPointFromCoords(pos);
            for (var j = 0; j < placedPoints.length; j++) {
              var dx = cp.x - placedPoints[j].x;
              var dy = cp.y - placedPoints[j].y;
              if (Math.sqrt(dx * dx + dy * dy) < LABEL_MIN_GAP_PX) { tooClose = true; break; }
            }
            if (!tooClose) placedPoints.push(cp);
          } catch (e) { tooClose = false; }
        }

        if (tooClose) {
          if (item.nameLabel) item.nameLabel.setMap(null);
          return;
        }

        if (!item.nameLabel) {
          item.nameLabel = new kakao.maps.CustomOverlay({
            position: pos,
            content: '<div class="name-label">' + item.point.name + '</div>',
            yAnchor: 1, zIndex: 25
          });
        }
        item.nameLabel.setMap(map);
      });
    }

    function refreshOverlays() {
      updateLabelPosition();
      updateFilteredNameLabels();
    }

    function clearMarkerFilter() {
      filterMode = null;
      activeBrandKey = null;
      contractFilterState = null;
      activeOperator = null;
      operatorEtcExpanded = false;
      filteredMarkerItems = [];
      allMarkers.forEach(function (item) {
        item.overlay.setMap(map);
        if (item.nameLabel) item.nameLabel.setMap(null);
      });
      updateContractPanel();
      updateOperatorPanel();
    }

    function applyMarkerFilter(items, statsLabel, mode) {
      filterMode = mode;
      filteredMarkerItems = items;

      var matchSet = {};
      items.forEach(function (item) {
        matchSet[item.point.name + '|' + item.point.lat + '|' + item.point.lng] = true;
      });

      allMarkers.forEach(function (item) {
        var key = item.point.name + '|' + item.point.lat + '|' + item.point.lng;
        if (matchSet[key]) {
          item.el.classList.remove('is-dim');
          setMarkerZ(item, Z_BASE, true);
          item.overlay.setMap(map);
        } else {
          item.overlay.setMap(null);
          if (item.nameLabel) item.nameLabel.setMap(null);
        }
      });

      updateFilteredNameLabels();
      updateBrandStats(items, statsLabel);
    }

    function filterByBrand(brandKey) {
      if (filterMode === 'brand' && activeBrandKey === brandKey) { resetAll(); return; }
      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = false;
      isShowingDistanceView = false;
      lastRenderState = null;
      contractFilterState = null;
      activeOperator = null; operatorEtcExpanded = false;
      updateContractPanel(); updateOperatorPanel();
      activeBrandKey = brandKey;

      var items = allMarkers.filter(function (item) {
        return classifyBrand(item.point.brand) === brandKey;
      });
      applyMarkerFilter(items, brandLabelText(brandKey) + ' 필터', 'brand');
    }

    function filterByContractYear(year) {
      if (contractFilterState && contractFilterState.year === year && contractFilterState.step == null) { resetAll(); return; }
      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = false;
      isShowingDistanceView = false;
      lastRenderState = null;
      activeBrandKey = null;
      activeOperator = null; operatorEtcExpanded = false;
      updateOperatorPanel();
      contractFilterState = { year: year, step: null };
      updateContractPanel();

      var items = allMarkers.filter(function (item) {
        return parseContractYear(item.point.contract) === year;
      });
      applyMarkerFilter(items, year + '년 만료', 'contract');
    }

    function filterByContractStep(step) {
      if (!contractFilterState || contractFilterState.year == null) return;
      if (contractFilterState.step === step) step = null;
      contractFilterState = { year: contractFilterState.year, step: step };
      updateContractPanel();

      var year = contractFilterState.year;
      var items = allMarkers.filter(function (item) {
        if (parseContractYear(item.point.contract) !== year) return false;
        if (step == null) return true;
        var sv = (item.point.contract_step == null ? "" : String(item.point.contract_step)).trim();
        return sv === step;
      });
      applyMarkerFilter(items, year + '년 만료' + (step ? (' · ' + step) : ''), 'contract');
    }

    function filterByOperator(opName) {
      if (filterMode === 'operator' && activeOperator === opName) { resetAll(); return; }
      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = false;
      isShowingDistanceView = false;
      lastRenderState = null;
      activeBrandKey = null;
      contractFilterState = null;
      updateContractPanel();
      activeOperator = opName;
      updateOperatorPanel();

      var items = allMarkers.filter(function (item) {
        return normalizeOperator(item.point.operator) === opName;
      });
      applyMarkerFilter(items, opName + ' 필터', 'operator');
    }

    function highlightMarkers(highway) {
      var target = normalize(highway);
      allMarkers.forEach(function (item) {
        if (normalize(item.point.highway) === target) {
          item.el.classList.remove('is-dim');
          setMarkerZ(item, Z_HIGHLIGHT, true);
        } else {
          item.el.classList.add('is-dim');
          setMarkerZ(item, Z_DIM, true);
        }
      });
    }

    function resetAll() {
      clearRoute();
      if (infowindow) infowindow.close();
      isShowingAllRoutes = false;
      isShowingDistanceView = false;
      lastRenderState = null;
      clearMarkerFilter();
      allMarkers.forEach(function (item) {
        item.el.classList.remove('is-dim');
        setMarkerZ(item, Z_BASE, true);
      });
      updateBrandStats(allMarkers, '전체노선');
    }

    function selectHighway(p) {
      isShowingAllRoutes = false;
      isShowingDistanceView = false;
      lastRenderState = { type: 'single', highway: p.highway };
      clearMarkerFilter();
      drawRoute(p.highway);
      highlightMarkers(p.highway);

      var target = normalize(p.highway);
      var group = allMarkers.filter(function (item) {
        return normalize(item.point.highway) === target;
      });
      if (group.length && target) updateBrandStats(group, p.highway);
      else updateBrandStats(allMarkers, '전체노선');
    }

    function onMarkerActivate(pos, p) {
      if (filterMode) {
        infowindow.setContent(buildContent(p));
        infowindow.setPosition(pos);
        infowindow.open(map);
      } else {
        activate(pos, p);
      }
    }

    function activate(pos, p) {
      infowindow.setContent(buildContent(p));
      infowindow.setPosition(pos);
      infowindow.open(map);
      selectHighway(p);
    }

    function applyMarkerScale() {
      if (!map) return;
      var level = map.getLevel();
      var small = level >= SMALL_MARKER_ZOOM_LEVEL;
      allMarkers.forEach(function (item) {
        if (small) item.el.classList.add('is-small');
        else item.el.classList.remove('is-small');
      });
      if (small) document.body.classList.add('markers-small');
      else document.body.classList.remove('markers-small');
    }

    function initMap(points, query, routeLengths) {
      log('총 마커 수: ' + (points ? points.length : 0));
      var container = document.getElementById('map');

      applyRouteLengths(routeLengths);

      if (!map) {
        var center = (points && points.length)
          ? new kakao.maps.LatLng(points[0].lat, points[0].lng)
          : new kakao.maps.LatLng(36.5, 127.8);
        map = new kakao.maps.Map(container, { center: center, level: 8 });
        infowindow = new kakao.maps.InfoWindow({ zIndex: 20000 });
        document.getElementById('resetBtn').addEventListener('click', resetAll);
        document.getElementById('showAllRoutesBtn').addEventListener('click', showAllRoutes);
        kakao.maps.event.addListener(map, 'idle', refreshOverlays);
        kakao.maps.event.addListener(map, 'zoom_changed', function () {
          applyMarkerScale();
          refreshOverlays();
        });

        var leftPanels = document.getElementById('leftPanels');
        var masterBtn = document.getElementById('filterMasterBtn');
        masterBtn.addEventListener('click', function () {
          var collapsed = leftPanels.classList.toggle('master-collapsed');
          masterBtn.textContent = collapsed ? '🔎 필터 열기' : '✖ 필터 닫기';
        });

        ['leftPanels'].forEach(function (id) {
          var el = document.getElementById(id);
          ['click', 'mousedown', 'touchstart', 'dblclick'].forEach(function (evt) {
            el.addEventListener(evt, function (e) { e.stopPropagation(); });
          });
        });
      } else {
        allMarkers.forEach(function (item) {
          item.overlay.setMap(null);
          if (item.nameLabel) item.nameLabel.setMap(null);
        });
        allMarkers = [];
        resetAll();
      }

      (points || []).forEach(function (p) {
        var pos = new kakao.maps.LatLng(p.lat, p.lng);
        var pinEl = createPinElement(p);

        var overlay = new kakao.maps.CustomOverlay({
          position: pos, content: pinEl,
          xAnchor: 0.5, yAnchor: 1, clickable: true, zIndex: Z_BASE
        });
        overlay.setMap(map);
        kakao.maps.event.preventMap(pinEl);

        var item = { overlay: overlay, el: pinEl, point: p, baseZIndex: Z_BASE, nameLabel: null };
        allMarkers.push(item);
        setMarkerZ(item, Z_BASE, true);

        pinEl.addEventListener('click', function () { onMarkerActivate(pos, p); });
        pinEl.addEventListener('mouseup', function () { onMarkerActivate(pos, p); });
        pinEl.addEventListener('touchstart', function (e) { e.preventDefault(); onMarkerActivate(pos, p); }, { passive: false });
        pinEl.addEventListener('mouseenter', function () { setMarkerZ(item, Z_HOVER, false); });
        pinEl.addEventListener('mouseleave', function () { setMarkerZ(item, item.baseZIndex, false); });
      });

      applyMarkerScale();
      updateBrandStats(allMarkers, '전체노선');
      updateContractPanel();
      updateOperatorPanel();

      if (query) {
        var hit = findMarkerByName(query);
        if (hit) {
          var hitPos = hit.overlay.getPosition();
          map.setLevel(6);
          map.panTo(hitPos);
          activate(hitPos, hit.point);
        }
      }
    }

    window.addEventListener('message', function (event) {
      if (event.source !== window.parent) return;
      var data = event.data;
      if (!data || data.type !== 'INIT_MAP_DATA') return;
      log('📩 postMessage 수신 (' + (data.points ? data.points.length : 0) + '건)');
      // [신규] 사진 서버 설정 저장 (페이지 파일에는 적어두지 않고, 로그인 후 앱에서만 받음)
      DRIVE_CFG = data.drive || null;
      if (mapReady) {
        initMap(data.points, data.query, data.routeLengths);
      } else {
        pendingMapData = data;
      }
    });

    kakao.maps.load(function () {
      var params = new URLSearchParams(window.location.search);
      DEBUG = params.get('debug') === '1';
      if (DEBUG) document.getElementById('debugPanel').style.display = 'block';
      mapReady = true;

      loadPrecomputedRoutes();
      loadDistancesData();

      if (pendingMapData) {
        initMap(pendingMapData.points, pendingMapData.query, pendingMapData.routeLengths);
        pendingMapData = null;
      }
    });
  </script>
</body>
</html>
